spring:
  application:
    name: Razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/RazorpayDB}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
